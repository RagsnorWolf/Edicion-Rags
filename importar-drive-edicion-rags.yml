name: Importar biblioteca desde Google Drive

on:
  workflow_dispatch:
    inputs:
      confirmar_publicacion:
        description: "Confirmo que el contenido de Drive puede publicarse en este repositorio público"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: importar-biblioteca-drive
  cancel-in-progress: false

jobs:
  importar:
    if: ${{ inputs.confirmar_publicacion == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Preparar Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install --local
          git config lfs.concurrenttransfers 4

      - name: Descargar ZIP desde Google Drive
        env:
          DRIVE_URL: "https://drive.google.com/file/d/1T7zHq_BxqTL_1-6iVIR-cx_OpmDdpJgR/view?usp=sharing"
        run: |
          python -m pip install --disable-pip-version-check gdown==5.2.0
          gdown --fuzzy "$DRIVE_URL" -O "$RUNNER_TEMP/biblioteca-rags.zip"
          test -s "$RUNNER_TEMP/biblioteca-rags.zip"
          ls -lh "$RUNNER_TEMP/biblioteca-rags.zip"

      - name: Validar y extraer sin sobrescribir archivos existentes
        id: extraer
        run: |
          python - <<'PY'
          import csv
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["RUNNER_TEMP"]) / "biblioteca-rags.zip"
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          destination_root = workspace / "Biblioteca_Drive"
          max_total = 8 * 1024**3
          max_file = 2 * 1024**3

          if not zipfile.is_zipfile(archive):
              raise SystemExit("El archivo descargado no es un ZIP válido.")
          if destination_root.exists():
              raise SystemExit(
                  "Ya existe Biblioteca_Drive en el repositorio. Se detuvo la importación "
                  "para no sobrescribir una importación anterior."
              )

          destination_root.mkdir(parents=True)
          seen = set()
          total = 0
          rows = []

          try:
              with zipfile.ZipFile(archive) as zf:
                  for info in zf.infolist():
                      raw = info.filename.replace("\\", "/")
                      if info.is_dir() or raw.endswith("/"):
                          continue

                      path = PurePosixPath(raw)
                      parts = tuple(part for part in path.parts if part not in ("", "."))
                      if path.is_absolute() or not parts or ".." in parts:
                          raise SystemExit(f"Ruta insegura dentro del ZIP: {info.filename!r}")
                      if any(part == ".git" for part in parts):
                          raise SystemExit(f"El ZIP contiene una ruta .git no permitida: {info.filename!r}")
                      if any(any(ch in part for ch in ("\n", "\r", "\x00")) for part in parts):
                          raise SystemExit(f"Nombre de archivo no admitido: {info.filename!r}")

                      unix_mode = (info.external_attr >> 16) & 0o170000
                      if unix_mode == stat.S_IFLNK:
                          raise SystemExit(f"El ZIP contiene un enlace simbólico: {info.filename!r}")

                      relative = "/".join(parts)
                      if relative in seen:
                          raise SystemExit(f"Ruta duplicada dentro del ZIP: {relative}")
                      seen.add(relative)

                      size = info.file_size
                      if size > max_file:
                          raise SystemExit(
                              f"El archivo {relative} pesa {size / 1024**3:.2f} GiB. "
                              "Git LFS Free/Pro admite como máximo 2 GiB por archivo."
                          )

                      total += size
                      if total > max_total:
                          raise SystemExit(
                              f"El contenido descomprimido supera el límite preventivo de 8 GiB "
                              f"({total / 1024**3:.2f} GiB). No se publicaron archivos."
                          )

                      target = destination_root.joinpath(*parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info, "r") as src, target.open("xb") as dst:
                          shutil.copyfileobj(src, dst, length=8 * 1024 * 1024)
                      rows.append((relative, size))

              if not rows:
                  raise SystemExit("El ZIP no contiene archivos para importar.")

              manifest = destination_root / "__indice_importacion.csv"
              with manifest.open("x", newline="", encoding="utf-8") as f:
                  writer = csv.writer(f)
                  writer.writerow(["ruta_relativa", "tamano_bytes"])
                  writer.writerows(rows)

              lfs_bytes = sum(size for _, size in rows if size > 50 * 1024**2)
              print(f"Archivos extraídos: {len(rows)}")
              print(f"Tamaño total extraído: {total / 1024**3:.2f} GiB")
              print(f"Datos que usarán Git LFS: {lfs_bytes / 1024**3:.2f} GiB")
              print("La biblioteca se conservará dentro de Biblioteca_Drive/.")

          except Exception:
              shutil.rmtree(destination_root, ignore_errors=True)
              raise
          PY

      - name: Configurar Git LFS para archivos grandes
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          root = Path("Biblioteca_Drive")
          threshold = 50 * 1024**2
          large = [p for p in root.rglob("*") if p.is_file() and p.stat().st_size > threshold]
          for path in large:
              subprocess.run(
                  ["git", "lfs", "track", "--filename", path.as_posix()],
                  check=True,
                  stdout=subprocess.DEVNULL
              )
          print(f"Archivos configurados en Git LFS: {len(large)}")
          PY

      - name: Preparar identidad de Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publicar archivos en lotes inferiores al límite de push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          root = Path("Biblioteca_Drive")
          files = sorted(p for p in root.rglob("*") if p.is_file())
          batch_limit = 1200 * 1024**2
          batches = []
          current = []
          current_size = 0

          for path in files:
              size = path.stat().st_size
              if current and current_size + size > batch_limit:
                  batches.append(current)
                  current = []
                  current_size = 0
              current.append(path.as_posix())
              current_size += size
          if current:
              batches.append(current)

          attributes = Path(".gitattributes")
          if attributes.exists():
              subprocess.run(["git", "add", "-f", "--", ".gitattributes"], check=True)
              result = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if result.returncode == 1:
                  subprocess.run(
                      ["git", "commit", "-m", "Configurar Git LFS para la biblioteca importada"],
                      check=True
                  )
                  subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
              elif result.returncode != 0:
                  raise SystemExit("No se pudo comprobar el estado de Git.")

          for index, batch in enumerate(batches, start=1):
              pathspec = Path(os.environ["RUNNER_TEMP"]) / f"pathspec-{index}.nul"
              pathspec.write_bytes(b"\0".join(p.encode("utf-8") for p in batch) + b"\0")
              subprocess.run(
                  ["git", "add", "-f", "--pathspec-from-file", str(pathspec), "--pathspec-file-nul"],
                  check=True
              )
              result = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if result.returncode == 0:
                  print(f"Lote {index}/{len(batches)}: no hay cambios; se omite.")
                  continue
              if result.returncode != 1:
                  raise SystemExit("No se pudo comprobar el estado de Git.")

              subprocess.run(
                  ["git", "commit", "-m", f"Importar biblioteca de Drive (lote {index}/{len(batches)})"],
                  check=True
              )
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
              print(f"Lote {index}/{len(batches)} publicado correctamente.")

          print(f"Importación terminada: {len(files)} archivos, {len(batches)} lotes.")
          PY
